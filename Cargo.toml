[workspace]
resolver = "2"
members = ["crates/server", "crates/engine", "crates/protocol", "crates/bundle"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ts-rs = { version = "10", features = ["serde-compat"] }
uuid = { version = "1", features = ["v4", "serde"] }
fred = { version = "10", features = ["i-scripts", "sha-1", "subscriber-client"] }

myquiz-engine = { path = "crates/engine" }
myquiz-protocol = { path = "crates/protocol" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
