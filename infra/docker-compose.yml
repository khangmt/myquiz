# The whole stack. Memory limits add up to about 9 GB, under the 16 GB cap on
# the faculty server (design section 10). The kernel kills a container that
# passes its limit and `restart: unless-stopped` brings it back, so the app
# never takes memory from other users' jobs.
#
#   cp .env.example .env   # then fill in the passwords
#   docker compose up -d --build

name: myquiz

x-app: &app
  build:
    context: ..
    dockerfile: infra/server.Dockerfile
  image: ${MYQUIZ_IMAGE:-myquiz-server:local}
  restart: unless-stopped
  cpu_shares: 512
  # The binary runs as an unprivileged user and binds a high port, so it
  # needs no Linux capabilities at all.
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &app-env
    DATABASE_URL: postgres://myquiz:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/myquiz
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    BIND_ADDR: 0.0.0.0:8080
    LOG_JSON: "true"
    RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    JOIN_URL: ${JOIN_URL:-}
    APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-true}
    RETENTION_DAYS: ${RETENTION_DAYS:-21}
    MAX_ACTIVE_GAMES: ${MAX_ACTIVE_GAMES:-100}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "myquiz", "healthcheck"]
    interval: 10s
    timeout: 3s
    retries: 3
  networks: [internal]

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    image: ${CADDY_IMAGE:-myquiz-caddy:local}
    restart: unless-stopped
    cpu_shares: 512
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      # Uploaded images, read only; the api writes them (SEC-11).
      - media_data:/media-files:ro
    depends_on: [api, game]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    networks: [internal, public]

  api:
    <<: *app
    command: ["api"]
    volumes:
      - media_data:/data/media
    # The api calls Google to finish sign-in, so it needs a way out as well
    # as the internal network. The game servers, PostgreSQL and Redis stay
    # internal only.
    networks: [internal, public]
    deploy:
      replicas: 2
      resources:
        limits: { memory: 512M, cpus: "1" }

  game:
    <<: *app
    command: ["game"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      replicas: 2
      resources:
        limits: { memory: 1G, cpus: "3" }

  postgres:
    image: postgres:16
    restart: unless-stopped
    cpu_shares: 512
    command: ["postgres", "-c", "shared_buffers=768MB", "-c", "max_connections=100"]
    environment:
      POSTGRES_USER: myquiz
      POSTGRES_DB: myquiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myquiz -d myquiz"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { memory: 3G, cpus: "1.5" }
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    cpu_shares: 512
    # AOF so live games survive a restart (NFR-06); noeviction because game
    # state must never be silently dropped.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1536mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1" }
    networks: [internal]

  # Nightly encrypted backups (NFR-07). Off until switched on at deploy:
  #   docker compose --profile backup up -d
  # It needs BACKUP_AGE_RECIPIENT; see README, "Backups".
  backup:
    profiles: [backup]
    build:
      context: ..
      dockerfile: infra/backup.Dockerfile
    image: ${BACKUP_IMAGE:-myquiz-backup:local}
    restart: unless-stopped
    cpu_shares: 256
    # Runs as the owner of the backup folder, so the files can be copied
    # off without sudo.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: postgres
      PGUSER: myquiz
      PGDATABASE: myquiz
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-8}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - media_data:/media-files:ro
    healthcheck:
      # Unhealthy when the last good backup is more than 26 hours old.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /backups/last-success 2>/dev/null || echo 0) )) -lt 93600"]
      interval: 1h
      start_period: 26h
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }
    networks: [internal]

volumes:
  pg_data:
  redis_data:
  caddy_data:
  media_data:

networks:
  internal:
    internal: true   # PostgreSQL and Redis are never reachable from outside (SEC-30)
  public:
