# Local development: only PostgreSQL and Redis, published on localhost so you
# can run `cargo run -p myquiz -- api` and `pnpm dev` directly.
#
#   docker compose -f infra/docker-compose.dev.yml up -d
name: myquiz-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: myquiz
      POSTGRES_PASSWORD: myquiz
      POSTGRES_DB: myquiz
    ports: ["127.0.0.1:5432:5432"]
    volumes: [dev_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]

volumes:
  dev_pg:
