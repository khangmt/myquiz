[package]
name = "myquiz"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
description = "The myquiz server: `myquiz api` for REST, `myquiz game` for live games."

[[bin]]
name = "myquiz"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
fred.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
myquiz-engine.workspace = true
myquiz-protocol.workspace = true
myquiz-bundle.workspace = true
uuid.workspace = true
rand = "0.9"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
hmac = "0.13.0"
time = { version = "0.3", features = ["formatting"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
webp = { version = "0.3.1", default-features = false }
tempfile = "3"
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
csv = "1.4.0"
rust_xlsxwriter = "0.104.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
