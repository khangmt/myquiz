# cargo deny (SEC-27): licences, banned or duplicate crates, and where
# crates may come from. Known advisories are checked by `cargo audit`
# as well (.cargo/audit.toml holds its ignores).

[graph]
all-features = false

[advisories]
# cargo deny only sees crates that are compiled, so the sqlx MySQL and
# SQLite advisories ignored in .cargo/audit.toml do not show up here.

[licenses]
# Permissive licences only: the app may be handed to the faculty or
# published, and none of these place conditions on that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# OpenSSL is never needed: TLS goes through rustls.
deny = [{ crate = "openssl-sys", reason = "use rustls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
